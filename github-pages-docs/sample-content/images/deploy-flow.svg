<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="480" fill="#f8fafc"/>

  <!-- title -->
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">Acme Order Service — Deployment Pipeline</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#475569">Every change ships through the same path; failures roll back automatically</text>

  <!-- main flow edges -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="190" y1="192" x2="226" y2="192" marker-end="url(#arrow)"/>
    <line x1="380" y1="192" x2="416" y2="192" marker-end="url(#arrow)"/>
    <line x1="570" y1="192" x2="606" y2="192" marker-end="url(#arrow)"/>
    <line x1="760" y1="192" x2="796" y2="192" marker-end="url(#arrow)"/>
    <line x1="950" y1="192" x2="986" y2="192" marker-end="url(#arrow)"/>
    <!-- fail branch: verify -> rollback -> staging -->
    <polyline points="875,234 875,350 764,350" marker-end="url(#arrow)"/>
    <line x1="685" y1="318" x2="685" y2="238" marker-end="url(#arrow)"/>
  </g>

  <!-- branch labels -->
  <text x="887" y="300" font-size="13" font-weight="600" fill="#dc2626">fail</text>
  <text x="697" y="285" font-size="13" font-weight="600" fill="#16a34a">retry</text>
  <text x="968" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">pass</text>

  <!-- commit -->
  <rect x="40" y="150" width="150" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="115" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Commit</text>
  <text x="115" y="208" text-anchor="middle" font-size="12" fill="#475569">git push</text>

  <!-- ci -->
  <rect x="230" y="150" width="150" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="305" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">CI</text>
  <text x="305" y="208" text-anchor="middle" font-size="12" fill="#475569">unit + integration</text>

  <!-- build image -->
  <rect x="420" y="150" width="150" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="495" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Build image</text>
  <text x="495" y="208" text-anchor="middle" font-size="12" fill="#475569">container registry</text>

  <!-- deploy staging -->
  <rect x="610" y="150" width="150" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="685" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Deploy staging</text>
  <text x="685" y="208" text-anchor="middle" font-size="12" fill="#475569">canary 10%</text>

  <!-- verify -->
  <rect x="800" y="150" width="150" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="875" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Verify</text>
  <text x="875" y="208" text-anchor="middle" font-size="12" fill="#475569">smoke checks</text>

  <!-- deploy prod -->
  <rect x="990" y="150" width="150" height="84" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="1065" y="184" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Deploy prod</text>
  <text x="1065" y="208" text-anchor="middle" font-size="12" fill="#475569">full rollout</text>

  <!-- rollback -->
  <rect x="610" y="318" width="150" height="64" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="685" y="344" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Rollback</text>
  <text x="685" y="366" text-anchor="middle" font-size="11" fill="#475569">revert to last good</text>
</svg>
