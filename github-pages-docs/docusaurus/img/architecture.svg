<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>

  <!-- title -->
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">Acme Order Service — System Architecture</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#475569">Synchronous request path (center) and asynchronous event path (right)</text>

  <!-- edges (drawn first so boxes sit on top where they meet) -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="600" y1="176" x2="600" y2="236" marker-end="url(#arrow)"/>
    <line x1="600" y1="316" x2="600" y2="376" marker-end="url(#arrow)"/>
    <line x1="760" y1="426" x2="876" y2="426" marker-end="url(#arrow)"/>
    <line x1="995" y1="458" x2="995" y2="556" marker-end="url(#arrow)"/>
    <line x1="490" y1="472" x2="254" y2="556" marker-end="url(#arrow)"/>
    <line x1="560" y1="472" x2="560" y2="556" marker-end="url(#arrow)"/>
    <polyline points="995,636 995,690 220,690 220,640" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="12" fill="#475569">
    <text x="612" y="212">HTTPS</text>
    <text x="612" y="352">REST</text>
    <text x="820" y="414" text-anchor="middle">publish</text>
    <text x="1007" y="512">consume</text>
    <text x="348" y="500" text-anchor="middle">SQL</text>
    <text x="572" y="520">cache</text>
    <text x="600" y="682" text-anchor="middle">writes results</text>
  </g>

  <!-- web client -->
  <rect x="470" y="100" width="260" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="131" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Web Client</text>
  <text x="600" y="155" text-anchor="middle" font-size="13" fill="#475569">React SPA · browser</text>

  <!-- api gateway -->
  <rect x="470" y="240" width="260" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="271" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">API Gateway</text>
  <text x="600" y="295" text-anchor="middle" font-size="13" fill="#475569">authn · routing · rate limiting</text>

  <!-- order service -->
  <rect x="440" y="380" width="320" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="414" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Order Service</text>
  <text x="600" y="440" text-anchor="middle" font-size="13" fill="#475569">HTTP API · order lifecycle</text>
  <text x="600" y="458" text-anchor="middle" font-size="13" fill="#475569">stateless · autoscaled</text>

  <!-- message queue -->
  <rect x="880" y="398" width="230" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="995" y="423" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Message Queue</text>
  <text x="995" y="444" text-anchor="middle" font-size="12" fill="#475569">order events</text>

  <!-- postgresql -->
  <rect x="110" y="560" width="220" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="220" y="591" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">PostgreSQL</text>
  <text x="220" y="615" text-anchor="middle" font-size="13" fill="#475569">orders · payments</text>

  <!-- redis -->
  <rect x="450" y="560" width="220" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="560" y="591" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Redis</text>
  <text x="560" y="615" text-anchor="middle" font-size="13" fill="#475569">cache · sessions</text>

  <!-- worker -->
  <rect x="880" y="560" width="230" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="995" y="591" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Worker</text>
  <text x="995" y="615" text-anchor="middle" font-size="13" fill="#475569">async jobs · webhooks</text>
</svg>
