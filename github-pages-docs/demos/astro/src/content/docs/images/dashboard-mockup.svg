<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- page background -->
  <rect x="0" y="0" width="1200" height="690" fill="#f1f5f9"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#111827"/>
  <text x="24" y="35" font-size="16" font-weight="600" fill="#f9fafb">Acme Order Service — Monitoring</text>

  <!-- time range selector -->
  <g font-size="12">
    <rect x="780" y="14" width="86" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="823" y="32" text-anchor="middle" fill="#9ca3af">Last 15 min</text>
    <rect x="870" y="14" width="92" height="28" rx="6" fill="#2563eb"/>
    <text x="916" y="32" text-anchor="middle" fill="#ffffff" font-weight="600">Last 1 hour</text>
    <rect x="966" y="14" width="96" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="1014" y="32" text-anchor="middle" fill="#9ca3af">Last 6 hours</text>
    <rect x="1066" y="14" width="110" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
    <text x="1121" y="32" text-anchor="middle" fill="#9ca3af">Last 24 hours</text>
  </g>

  <!-- stat panel 1: req/s -->
  <rect x="20" y="76" width="373" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="106" font-size="13" fill="#475569">Requests / sec</text>
  <text x="44" y="150" font-size="34" font-weight="600" fill="#0f172a">1,284</text>
  <text x="44" y="176" font-size="12" fill="#16a34a">▲ 4.2% vs previous</text>

  <!-- stat panel 2: p99 latency -->
  <rect x="413" y="76" width="373" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="437" y="106" font-size="13" fill="#475569">p99 latency</text>
  <text x="437" y="150" font-size="34" font-weight="600" fill="#0f172a">243 ms</text>
  <text x="437" y="176" font-size="12" fill="#d97706">▲ 12 ms vs previous</text>

  <!-- stat panel 3: error % -->
  <rect x="806" y="76" width="373" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="106" font-size="13" fill="#475569">Error rate</text>
  <text x="830" y="150" font-size="34" font-weight="600" fill="#0f172a">2.4 %</text>
  <text x="830" y="176" font-size="12" fill="#dc2626">▲ 1.9 pp vs previous</text>

  <!-- error rate chart panel -->
  <rect x="20" y="206" width="740" height="460" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="238" font-size="15" font-weight="600" fill="#0f172a">Error rate</text>
  <circle cx="560" cy="233" r="5" fill="#dc2626"/>
  <text x="572" y="238" font-size="12" fill="#475569">error rate</text>
  <circle cx="660" cy="233" r="5" fill="#2563eb"/>
  <text x="672" y="238" font-size="12" fill="#475569">5xx errors</text>

  <!-- gridlines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="600" x2="730" y2="600"/>
    <line x1="70" y1="515" x2="730" y2="515"/>
    <line x1="70" y1="430" x2="730" y2="430"/>
    <line x1="70" y1="345" x2="730" y2="345"/>
    <line x1="70" y1="260" x2="730" y2="260"/>
  </g>
  <g font-size="12" fill="#475569" text-anchor="end">
    <text x="62" y="604">0%</text>
    <text x="62" y="519">1%</text>
    <text x="62" y="434">2%</text>
    <text x="62" y="349">3%</text>
    <text x="62" y="264">4%</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="70" y="624">13:00</text>
    <text x="202" y="624">13:15</text>
    <text x="334" y="624">13:30</text>
    <text x="466" y="624">13:45</text>
    <text x="597" y="624">14:00</text>
    <text x="729" y="624">14:15</text>
  </g>

  <!-- axes -->
  <line x1="70" y1="260" x2="70" y2="600" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="70" y1="600" x2="730" y2="600" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- area under error line -->
  <polygon points="70,566 114,557 158,574 202,549 246,566 290,557 334,540 378,557 422,498 448,362 466,311 484,353 509,464 553,523 597,549 641,557 685,566 729,557 729,600 70,600" fill="#dc2626" opacity="0.08"/>

  <!-- alert threshold -->
  <line x1="70" y1="430" x2="730" y2="430" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="726" y="422" text-anchor="end" font-size="11" fill="#dc2626">alert threshold 2%</text>

  <!-- 5xx line -->
  <polyline points="70,591 158,583 246,574 334,566 422,557 448,481 466,447 484,498 509,515 553,549 597,566 641,574 685,574 729,574" fill="none" stroke="#2563eb" stroke-width="2"/>

  <!-- error rate line -->
  <polyline points="70,566 114,557 158,574 202,549 246,566 290,557 334,540 378,557 422,498 448,362 466,311 484,353 509,464 553,523 597,549 641,557 685,566 729,557" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- requests by status panel -->
  <rect x="780" y="206" width="400" height="460" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="804" y="238" font-size="15" font-weight="600" fill="#0f172a">Requests by status</text>

  <g font-size="13" fill="#475569">
    <text x="804" y="284">200 OK</text>
    <rect x="804" y="294" width="246" height="36" rx="4" fill="#16a34a"/>
    <text x="1060" y="318" font-weight="600" fill="#0f172a">86%</text>

    <text x="804" y="364">404 Not Found</text>
    <rect x="804" y="374" width="20" height="36" rx="4" fill="#d97706"/>
    <text x="834" y="398" font-weight="600" fill="#0f172a">7%</text>

    <text x="804" y="444">429 Rate limited</text>
    <rect x="804" y="454" width="14" height="36" rx="4" fill="#d97706"/>
    <text x="828" y="478" font-weight="600" fill="#0f172a">4%</text>

    <text x="804" y="524">5xx Server</text>
    <rect x="804" y="534" width="14" height="36" rx="4" fill="#dc2626"/>
    <text x="828" y="558" font-weight="600" fill="#0f172a">3%</text>
  </g>
  <text x="804" y="640" font-size="12" fill="#475569">last 1 hour · all regions</text>
</svg>
